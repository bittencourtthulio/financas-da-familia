# Fluxo de exemplo (PR-23). A verificação de verdade é o comando do projeto,
# `npm run verificar`; este arquivo só o dispara a cada mudança. Se o
# repositório morar fora do GitHub, troque apenas este gatilho.
name: verificar

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financas_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Preparar o ambiente de verificação
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/financas_teste" >> "$GITHUB_ENV"
          echo "DATABASE_URL_TESTE=postgresql://postgres:postgres@localhost:5432/financas_teste" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npx prisma generate
      - run: npm run verificar
